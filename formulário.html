<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Crud</title>
</head>
<body>
    <form action="salvar.php" method="POST">
    <h1>Cadastro de Funcionario</h1>
    <label for="idFunc">Id do funcionario:</label>
    <input type="number" id="idFunc" name="idFunc" required>
     <hr>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>
     <hr>
    <label for="matricula">Matricula:</label>
    <input type="number" id="matricula" name="matricula" required>
    <hr>
    <label for="funcao">Funcao:</label>
    <input type="text" id="funcao" name="funcao" required>
     <hr>
    <label for="departamento">Departamento:</label>
    <input type="text" id="departamento" name="departamento" required>
    <hr>
    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade">
    <hr>
    <label for="cpf">CPF:</label>
    <input type="number" id="cpf" name="cpf" required>
     <hr>
    <label for="salario">Salario:</label>
    <input type="number" id="salario" name="salario" step="0.001" min="0" required>
    <hr>
    <label for="endereco">Endereco:</label>
    <input type="text" id="endereco" name="endereco" required>
    <hr>
    <label for="uf">UF(ESTADO):</label>
    <input type="text" id="uf" name="uf" required>
    <hr>
    <label for="pais">Pais:</label>
    <input type="text" id="pais" name="pais" required>
    <input type="submit" size="50" value=Cadastrar>

</body>
</html>
