<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Roupas</title>
</head>
<body>

<h2>Cadastro de Roupas</h2>
<form action="cadastro.php" method="POST">
  <label for="codigo">Código:</label>
  <input type="text" id="codigo" name="codigo" required>

  <label for="nome">Nome da Roupa:</label>
  <input type="text" id="nome" name="nome" required>

  <label for="categoria">Categoria:</label>
  <input type="text" id="categoria" name="categoria" required>

  <label for="marca">Marca:</label>
  <input type="text" id="marca" name="marca" required>

  <label for="tamanho">Tamanho:</label>
  <input type="text" id="tamanho" name="tamanho" required>

  <label for="cor">Cor:</label>
  <input type="text" id="cor" name="cor" required>

  <label for="material">Material:</label>
  <input type="text" id="material" name="material" required>

  <label for="preco">Preço (ex.: 49.90):</label>
  <input type="text" id="preco" name="preco" placeholder="49.90" required>

  <label for="quantidade">Quantidade em Estoque:</label>
  <input type="number" id="quantidade" name="quantidade" required>

  <label for="descricao">Descrição:</label>
  <input type="text" id="descricao" name="descricao" required>

  <button type="submit">Cadastrar Roupa</button>
</form>

</body>
</html>
